<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- flagella -->
  <g fill="none" stroke="#a02a45" stroke-width="2.6" stroke-linecap="round">
    <path d="M14 44 C 8 46, 8 54, 3 56"/>
    <path d="M12 36 C 5 36, 6 30, 1 29"/>
    <path d="M50 20 C 56 18, 56 10, 62 8"/>
    <path d="M52 28 C 59 29, 58 35, 63 36"/>
  </g>
  <!-- rod-shaped cell (bacillus), tilted -->
  <g transform="rotate(-30 32 32)">
    <rect x="10" y="22" width="44" height="20" rx="10" fill="#a02a45"/>
    <rect x="13.5" y="25.5" width="37" height="13" rx="6.5" fill="none" stroke="#faf8f4" stroke-width="1.6" opacity=".55"/>
    <!-- cytoplasm granules -->
    <circle cx="22" cy="30" r="2.2" fill="#faf8f4" opacity=".9"/>
    <circle cx="31" cy="35" r="1.8" fill="#faf8f4" opacity=".9"/>
    <circle cx="41" cy="29.5" r="2.4" fill="#faf8f4" opacity=".9"/>
  </g>
</svg>
